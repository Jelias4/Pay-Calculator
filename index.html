<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gross Pay Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gross Pay Calculator</h1>
        <div class="input-group">
            <label for="pay">Pay per Hour ($):</label>
            <input type="number" id="pay" placeholder="Enter hourly pay">
        </div>
        <div class="input-group">
            <label for="hours">Hours Worked:</label>
            <input type="number" id="hours" placeholder="Enter hours worked">
        </div>
        <button onclick="calculateGrossPay()">Calculate</button>
        <div id="result">Gross Pay: $0.00</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
